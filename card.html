<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>碎雪视差·稳定平滑版</title>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Aidian SignatureTi Marker pen';
    src: url('https://www.fonts.net.cn/ttf/Aidian-SignatureTi-Marker-pen-Medium-2.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    position: fixed;                     /* 移动端彻底锁死滚动 */
    overflow: hidden;
    overscroll-behavior: none;           /* 禁止回弹 */
    -webkit-overflow-scrolling: auto;
    touch-action: none;                  /* 禁止浏览器接管触摸手势 */
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    position: absolute;
    width: 962px;
    height: 642px;
    transform-origin: 0 0;
    overflow: hidden;
    background: transparent;
    border-radius: 20px;
    cursor: pointer;
    touch-action: none;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .layer {
    position: absolute;
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  /* 底图 */
  .bottom-bg {
    top: 90px;
    right: 8px;
    width: 680px;
    height: 445px;
    z-index: 1;
  }
  .bottom-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }
  .bg-particle-overlay {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background-image: 
      radial-gradient(circle at 21% 39%, rgba(239,229,219,0.22) 2px, transparent 3px),
      radial-gradient(circle at 73% 57%, rgba(216,206,195,0.11) 1px, transparent 2px),
      radial-gradient(circle at 51% 65%, rgba(186,176,166,0.16) 2px, transparent 3px);
    background-size: 119px 116px;
    animation: particleMove 32s linear infinite;
    pointer-events: none;
  }
  @keyframes particleMove {
    0% { background-position: 0 0; }
    100% { background-position: 357px 464px; }
  }

  /* 远景碎雪 */
  .snow-far {
    inset: -20% 0 0 0;
    width: 106%;
    height: 145%;
    z-index: 6;
    pointer-events: none;
    background-image:
      radial-gradient(circle, rgba(220,215,209,0.07) 1.5px, transparent 2px),
      radial-gradient(circle, rgba(241,236,229,0.045) 1.5px, transparent 2px),
      radial-gradient(circle, rgba(188,178,166,0.015) 2px, transparent 2.5px);
    background-size: 66px 64px, 121px 120px, 178px 174px;
    background-position: 0 0, 42px 50px, 93px 25px;
    animation: snowFallFar 26s linear infinite;
  }
  @keyframes snowFallFar {
    0%   { background-position: 0 -10%, -20px 0; }
    100% { background-position: 0 110%, 104px 0; }
  }

  /* 近景碎雪 */
  .snow-near {
    inset: -25% 0 0 0;
    width: 108%;
    height: 154%;
    z-index: 18;
    pointer-events: none;
    background-image:
      radial-gradient(circle, rgba(255,251,246,0.938) 2.2px, transparent 3.2px),
      radial-gradient(circle, rgba(255,253,249,0.728) 2.8px, transparent 3.8px),
      radial-gradient(circle, rgba(255,253,254,0.882) 1.6px, transparent 2.6px);
    background-size: 46px 45px, 76px 70px, 156px 150px;
    background-position: 2px 0, 28px 22px, 54px 68px;
    animation: snowFallNear 16s linear infinite;
  }
  @keyframes snowFallNear {
    0%   { background-position: 0 -12%, 0 0; }
    50%  { background-position: 18px 56%, 8px 0; }
    100% { background-position: -12px 128%, 0 0; }
  }

  /* 图一包裹层（含S型红线） */
  .top-img-wrapper {
    top: 6px;
    left: -94px; 
    width: 518px;  
    height: 517px; 
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
  }
  .top-img-wrapper img {
    width: 86%;
    height: 85%;
    object-fit: contain; 
    border-radius: 16px;
    filter: drop-shadow(0 20px 48px rgba(0,0,0,0.335));
  }
  .red-thread-main {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* 右下角新图 + 缠绕红线 */
  .corner-wrapper {
    right: 8px;
    bottom: 4px;
    width: 256px;
    height: 254px;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    pointer-events: none;
  }
  .corner-wrapper img {
    width: 86%;
    height: 87%;
    object-fit: contain;
    filter: drop-shadow(0 12px 32px rgba(0,0,0,0.265));
    opacity: 0.942;
  }
  .red-thread-corner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  /* 文字块（包含缠绕红绳） */
  .text-block {
    top: 34px;
    right: 22px;
    z-index: 22;
    font-family: 'Aidian SignatureTi Marker pen', 'Alex Brush', 'Brush Script MT', 'Segoe Print', cursive;
    text-align: right;
    pointer-events: none;
    color: rgba(49, 46, 42, 0.984);
    filter: blur(0.35px);
    text-shadow: 
      0 0 4px rgba(142, 140, 135, 0.002),
      0 0 10px rgba(152, 155, 151, 0.001);
    letter-spacing: 0.4px;
    transform-style: preserve-3d;
    position: absolute;
  }
  .text-block p {
    margin: 0;
    font-size: 32px;
    line-height: 1.542;
    white-space: nowrap;
  }
  .text-block p:last-child {
    font-size: 29px;
    opacity: 0.912;
  }

  /* 缠绕红绳 SVG 层 */
  .wrap-thread {
    position: absolute;
    top: -6px;
    left: -18px;
    width: 1002px;
    height: 145px;
    pointer-events: none;
    overflow: visible;
    z-index: 23;
  }
</style>
</head>
<body>

<div class="container" id="container">

  <!-- 底图 -->
  <div class="layer bottom-bg" data-depth="0.15">
    <img src="https://Asamoisnailong.github.io/qianmo/1_1793846194156_mud1r.jpg" alt="底图">
    <div class="bg-particle-overlay"></div>
  </div>

  <!-- 远景碎雪 -->
  <div class="layer snow-far" data-depth="0.4"></div>

  <!-- 图一 + S型红线 -->
  <div class="layer top-img-wrapper" data-depth="1.0">
    <img src="https://Asamoisnailong.github.io/qianmo/4_1793849874904_k8i1n.png" alt="图一">
    <svg class="red-thread-main" viewBox="0 0 522 521" xmlns="http://www.w3.org/2000/svg">
      <path id="mainThreadPath" d="" stroke="#d64040" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  <!-- 右下角新图 + 缠绕红线 -->
  <div class="layer corner-wrapper" data-depth="0.35">
    <img src="https://Asamoisnailong.github.io/qianmo/1793895849894_1793895937880_dpsr5.png" alt="右下角装饰">
    <svg class="red-thread-corner" viewBox="0 0 264 263" xmlns="http://www.w3.org/2000/svg">
      <path id="cornerThreadPath" d="" stroke="#d64040" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

  <!-- 近景碎雪 -->
  <div class="layer snow-near" data-depth="1.8"></div>

  <!-- 文字 + 加长圆润缠绕红绳 -->
  <div class="layer text-block" data-depth="0.6">
    <p>The bird wishes it were a cloud.</p>
    <p>The cloud wishes it were a bird.</p>
    <svg class="wrap-thread" viewBox="0 0 1018 161" xmlns="http://www.w3.org/2000/svg">
      <path id="wrapPath" d="" stroke="#d64040" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>

</div>

<script>
  // ========== 缩放适配 ==========
  const container = document.getElementById('container');
  const BASE_W = 964;
  const BASE_H = 644;

  function doResize() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const s = Math.min(winW / BASE_W, winH / BASE_H, 1);
    container.style.transform = `scale(${s})`;
    container.style.left = `${(winW - BASE_W * s) / 2}px`;
    container.style.top = `${(winH - BASE_H * s) / 2}px`;
  }
  doResize();

  // ========== 视差系统（极低lerp，无旋转） ==========
  const layers = [...document.querySelectorAll('.layer')];
  let targetX = 0, targetY = 0;
  let curX = 0, curY = 0;

  function onMove(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const scaleVal = parseFloat(container.style.transform.match(/scale\(([^)]+)\)/)?.[1] || 1);
    const rawX = (clientX - rect.left) / scaleVal;
    const rawY = (clientY - rect.top) / scaleVal;
    const cx = BASE_W / 2;
    const cy = BASE_H / 2;
    targetX = (rawX - cx) / (BASE_W / 2);
    targetY = (rawY - cy) / (BASE_H / 2);
  }

  container.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));

  // 关键：passive 必须为 false，才能 preventDefault 锁死滚动
  container.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });

  container.addEventListener('mouseleave', () => { targetX = 0; targetY = 0; });
  container.addEventListener('touchend', () => { targetX = 0; targetY = 0; });

  // ========== 所有动画合并到一个 RAF ==========
  const mainThread = document.getElementById('mainThreadPath');
  const mw = 524, mh = 523;
  let angleMain = 0;

  const cornerThread = document.getElementById('cornerThreadPath');
  const cw = 266, ch = 265;
  let angleCorner = 0;

  const wrapPath = document.getElementById('wrapPath');
  const ww = 1022, wh = 169;
  let phaseWrap = 0;

  function mainLoop() {
    // --- 视差 ---
    curX += (targetX - curX) * 0.014;
    curY += (targetY - curY) * 0.013;

    // 钳制在 [-1, 1]，防止飞出抖动
    curX = Math.max(-1, Math.min(1, curX));
    curY = Math.max(-1, Math.min(1, curY));

    layers.forEach(layer => {
      const depth = parseFloat(layer.dataset.depth || '1');
      const px = -curX * depth * 28;
      const py = -curY * depth * 28;
      layer.style.transform = `translate3d(${px}px, ${py}px, 0)`;
    });

    // --- 图一 S型红线 ---
    angleMain += 0.023;
    const pts1 = [];
    const steps1 = 200;
    for (let i = 0; i <= steps1; i++) {
      const t = i / steps1;
      const theta = t * Math.PI * 2 + angleMain;
      const rx = mw * 0.387;
      const ry = mh * 0.372;
      const cx = mw / 2;
      const cy = mh / 2;
      const sMod = Math.sin(t * Math.PI * 4 + angleMain * 0.7) * 0.22;
      const x = cx + Math.cos(theta) * rx * (1 + sMod);
      const y = cy + Math.sin(theta) * ry * (1 - sMod);
      pts1.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    mainThread.setAttribute('d', `M${pts1.join(' L')}`);

    // --- 右下角 S型红线 ---
    angleCorner += 0.034;
    const pts2 = [];
    const steps2 = 130;
    for (let i = 0; i <= steps2; i++) {
      const t = i / steps2;
      const theta = t * Math.PI * 2 + angleCorner;
      const rx = cw * 0.373;
      const ry = ch * 0.361;
      const cx = cw / 2;
      const cy = ch / 2;
      const sMod = Math.sin(t * Math.PI * 4 + angleCorner * 0.7) * 0.17;
      const x = cx + Math.cos(theta) * rx * (1 + sMod);
      const y = cy + Math.sin(theta) * ry * (1 - sMod);
      pts2.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    cornerThread.setAttribute('d', `M${pts2.join(' L')}`);

    // --- 文字缠绕红绳 ---
    phaseWrap += 0.036;
    const pts3 = [];
    const segs = 460;
    const base1 = 36;
    const base2 = 90;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const x = t * ww;
      const wave1 = Math.sin(x * 0.032 + phaseWrap) * 16;
      const wave2 = Math.sin(x * 0.056 + phaseWrap * 1.2) * 5;
      const wave3 = Math.sin(x * 0.006 + phaseWrap * 0.5) * 12;
      const baseMix = 0.5 + 0.5 * Math.sin(x * 0.022 + phaseWrap * 0.7);
      const baseY = base1 * (1 - baseMix) + base2 * baseMix;
      const y = baseY + wave1 + wave2 + wave3;
      pts3.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    wrapPath.setAttribute('d', `M${pts3.join(' L')}`);

    requestAnimationFrame(mainLoop);
  }
  mainLoop();

  // ========== 点击迸发效果（去重） ==========
  let lastBurstTime = 0;

  container.addEventListener('click', function(e) {
    const rect = container.getBoundingClientRect();
    const scaleVal = parseFloat(container.style.transform.match(/scale\(([^)]+)\)/)?.[1] || 1);
    const rawX = (e.clientX - rect.left) / scaleVal;
    const rawY = (e.clientY - rect.top) / scaleVal;
    burstSnow(rawX, rawY);
  });

  container.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      const rect = container.getBoundingClientRect();
      const scaleVal = parseFloat(container.style.transform.match(/scale\(([^)]+)\)/)?.[1] || 1);
      const rawX = (e.touches[0].clientX - rect.left) / scaleVal;
      const rawY = (e.touches[0].clientY - rect.top) / scaleVal;
      burstSnow(rawX, rawY);
    }
  }, { passive: false });

  function burstSnow(cx, cy) {
    const now = Date.now();
    if (now - lastBurstTime < 200) return;   // 200ms 内只触发一次
    lastBurstTime = now;

    const count = 40;
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'burst-snow';
      const size = 2 + Math.random() * 3.5;
      el.style.cssText = `
        position: absolute;
        width: ${size}px;
        height: ${size}px;
        background: rgba(255,255,255,${0.7 + Math.random() * 0.3});
        border-radius: 50%;
        pointer-events: none;
        left: ${cx}px;
        top: ${cy}px;
        will-change: transform, opacity;
      `;
      fragment.appendChild(el);
    }
    container.appendChild(fragment);

    const particles = container.querySelectorAll('.burst-snow');
    const params = [];
    particles.forEach((el) => {
      const angle = Math.random() * 2 * Math.PI;
      const radius = 60 + Math.random() * 100;
      const vx = Math.cos(angle) * radius;
      const vy = Math.sin(angle) * radius - 15;
      const rot = Math.random() * 540 - 270;
      const duration = 600 + Math.random() * 470;
      const startTime = performance.now();
      params.push({ el, vx, vy, rot, duration, startTime });
    });

    function animateBurst(time) {
      let alive = false;
      params.forEach(p => {
        const elapsed = time - p.startTime;
        const progress = Math.min(elapsed / p.duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const tx = p.vx * easeOut;
        const ty = p.vy * easeOut + 25 * easeOut * easeOut;
        const scaleP = 1 - 0.5 * easeOut;
        const opacity = 1 - easeOut;
        p.el.style.transform = `translate(${tx}px, ${ty}px) rotate(${p.rot * easeOut}deg) scale(${scaleP})`;
        p.el.style.opacity = opacity;
        if (progress < 1) alive = true;
      });
      if (alive) requestAnimationFrame(animateBurst);
      else {
        document.querySelectorAll('.burst-snow').forEach(el => el.remove());
      }
    }
    requestAnimationFrame(animateBurst);
  }
</script>
</body>
</html>
