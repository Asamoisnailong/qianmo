<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin: 0; padding: 0; background: #fff; overflow: hidden; }
  .container { position: relative; width: 100vw; height: 100vh; }
  /* 底图 */
  .bg { 
    position: absolute; top: 14%; right: 2%; width: 70%; height: 70%; 
    background: url("https://Asamoisnailong.github.io/qianmo/1_1793846194156_mud1r.jpg") center/cover no-repeat; 
    border-radius: 16px; 
  }
  /* 图一 */
  .top { 
    position: absolute; top: 2%; left: -5%; width: 55%; height: 80%; 
    background: url("https://Asamoisnailong.github.io/qianmo/4_1793849874904_k8i1n.png") center/contain no-repeat; 
    filter: drop-shadow(0 20px 48px rgba(0,0,0,0.3));
  }
  /* 右下角 */
  .corner { 
    position: absolute; right: 2%; bottom: 2%; width: 28%; height: 40%; 
    background: url("https://Asamoisnailong.github.io/qianmo/1793895849894_1793895937880_dpsr5.png") center/contain no-repeat; 
    filter: drop-shadow(0 12px 32px rgba(0,0,0,0.2));
  }
  /* 文字 */
  .text { 
    position: absolute; top: 5%; right: 3%; 
    font-family: 'Brush Script MT', 'Segoe Print', cursive; 
    text-align: right; color: #31302a; 
  }
  .text p { margin: 0; font-size: 1.6rem; line-height: 1.5; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <div class="bg"></div>
  <div class="top"></div>
  <div class="corner"></div>
  <div class="text">
    <p>The bird wishes it were a cloud.</p >
    <p>The cloud wishes it were a bird.</p >
  </div>
</div>
</body>
</html>
