<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Player · 高级磨砂音乐播放器</title>
<style>
  :root{
    --accent-1:#7b61ff;
    --accent-2:#2dd4ff;
    --glass:rgba(255,255,255,.10);
    --glass-strong:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.28);
    --line-soft:rgba(255,255,255,.13);
    --text:#ffffff;
    --muted:rgba(255,255,255,.62);
    --shadow:0 24px 80px rgba(8,10,30,.45);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);
    min-height:100vh;overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      radial-gradient(900px 600px at 12% 18%,rgba(255,120,180,.55),transparent 60%),
      radial-gradient(800px 700px at 88% 12%,rgba(120,90,255,.60),transparent 60%),
      radial-gradient(900px 600px at 50% 95%,rgba(60,220,200,.50),transparent 60%),
      linear-gradient(140deg,#1a1230 0%,#241842 45%,#14102e 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= 演示主页 ================= */
  .hero{
    text-align:center;max-width:560px;padding:52px 44px;
    background:var(--glass);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid var(--line);border-radius:28px;
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.25);
    position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 40%);
    pointer-events:none;
  }
  .hero .kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:18px;}
  .hero h1{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.25;margin-bottom:14px;}
  .hero h1 span{background:linear-gradient(90deg,#c7b8ff,#7ee8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .hero p{color:var(--muted);line-height:1.9;font-size:15px;}

  /* ================= 浮动按钮 ================= */
  .fab{
    position:fixed;right:26px;top:50%;transform:translateY(-50%);
    width:56px;height:76px;border:none;cursor:pointer;
    border-radius:18px 4px 4px 18px;z-index:101;
    background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.08));
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--line);border-right:none;
    box-shadow:0 10px 34px rgba(8,10,30,.5),inset 0 1px 0 rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s cubic-bezier(.23,1,.32,1),opacity .3s;
  }
  .fab:hover{transform:translateY(-50%) scale(1.05);}
  .fab.hide{opacity:0;pointer-events:none;transform:translateY(-50%) translateX(40px);}
  .fab .note{
    width:26px;height:26px;border-radius:7px;position:relative;z-index:2;
    background:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    box-shadow:0 4px 14px rgba(123,97,255,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .fab .note::before{
    content:"";width:11px;height:11px;border-radius:50%;
    background:rgba(255,255,255,.95);box-shadow:0 0 10px rgba(255,255,255,.8);
  }
  .fab .bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;
    background:linear-gradient(180deg,var(--accent-1),var(--accent-2));opacity:.5;}
  .fab .pip{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;
    background:#ff4d6d;box-shadow:0 0 8px #ff4d6d;z-index:3;
    animation:pip 2.4s ease infinite;}
  .fab .mini{
    position:absolute;inset:0;border-radius:18px 4px 4px 18px;z-index:1;
    background-size:cover;background-position:center;opacity:0;transition:opacity .4s;
  }
  .fab .mini.show{opacity:1;}
  @keyframes pip{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.35;transform:scale(.75);}}

  /* ================= 遮罩 ================= */
  .veil{
    position:fixed;inset:0;z-index:99;
    background:rgba(10,8,24,.45);backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;
  }
  .veil.show{opacity:1;visibility:visible;}

  /* ================= 侧边栏 ================= */
  .drawer{
    position:fixed;inset:16px 16px 16px auto;width:380px;max-width:88vw;z-index:100;
    display:flex;flex-direction:column;
    transform:translateX(calc(100% + 30px));
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    border-radius:28px;overflow:hidden;
    background:linear-gradient(165deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    backdrop-filter:blur(30px) saturate(190%);
    -webkit-backdrop-filter:blur(30px) saturate(190%);
    border:1px solid var(--line);
    box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.18);
  }
  .drawer.show{transform:translateX(0);}
  .drawer::before{
    content:"";position:absolute;left:0;right:0;top:0;height:160px;
    background:linear-gradient(180deg,rgba(255,255,255,.16),transparent);pointer-events:none;
  }
  .drawer::after{
    content:"";position:absolute;width:340px;height:340px;border-radius:50%;
    right:-120px;top:-90px;
    background:radial-gradient(circle,rgba(123,97,255,.30),transparent 65%);
    filter:blur(20px);pointer-events:none;
  }

  /* 顶栏 */
  .top{padding:22px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:2;}
  .top .label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
  .top .nowplay{font-size:15px;font-weight:700;letter-spacing:.3px;}
  .top-actions{display:flex;gap:8px;align-items:center;}
  .tbtn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--line-soft);
    background:rgba(255,255,255,.10);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px);transition:all .2s;
  }
  .tbtn:hover{background:rgba(255,255,255,.24);transform:scale(1.1);}
  .tbtn svg{width:15px;height:15px;fill:#fff;}

  /* 封面 */
  .stage{padding:26px 24px 6px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:2;}
  .cover-wrap{
    width:210px;height:210px;border-radius:24px;position:relative;
    padding:8px;
    background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.04));
    border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(8,10,30,.5),inset 0 1px 0 rgba(255,255,255,.5);
  }
  .cover-wrap::before{
    content:"";position:absolute;inset:-3px;border-radius:27px;z-index:-1;
    background:var(--cover-glow,linear-gradient(135deg,#7b61ff,#2dd4ff));
    filter:blur(16px);opacity:.55;
  }
  .cover{
    width:100%;height:100%;border-radius:18px;position:relative;overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
  }
  .cover .art{
    position:absolute;inset:0;background-size:cover;background-position:center;
    transition:transform .6s cubic-bezier(.22,1,.36,1);
  }
  .cover .art::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 45%,rgba(0,0,0,.35));
  }
  .cover .vignette{position:absolute;inset:0;box-shadow:inset 0 0 40px rgba(0,0,0,.4);}
  .cover .glow-orb{
    position:absolute;width:90px;height:90px;border-radius:50%;
    background:var(--orb,rgba(255,255,255,.5));filter:blur(26px);opacity:.7;
    top:22%;left:22%;transition:background .6s,transform .8s;
  }
  .cover-wrap.spin .art{animation:coverSpin 18s linear infinite;}
  .cover-wrap.spin:hover .art{transform:scale(1.06);}
  @keyframes coverSpin{to{transform:rotate(360deg);}}

  .info{text-align:center;margin-top:22px;min-height:52px;}
  .info .name{font-size:19px;font-weight:700;letter-spacing:.3px;text-shadow:0 2px 8px rgba(0,0,0,.3);}
  .info .artist{font-size:13px;color:var(--muted);margin-top:6px;}

  /* 频谱 */
  .spectrum{display:flex;align-items:center;justify-content:center;gap:4px;height:30px;margin-top:14px;}
  .spectrum span{
    width:4px;height:6px;border-radius:3px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.4));
    transition:height .12s ease;box-shadow:0 0 8px rgba(255,255,255,.5);
  }

  /* 进度 */
  .seek-wrap{padding:8px 24px 0;position:relative;z-index:2;}
  .seek{width:100%;height:5px;border-radius:6px;cursor:pointer;position:relative;
    background:rgba(255,255,255,.16);box-shadow:inset 0 1px 3px rgba(0,0,0,.25);}
  .seek .track{position:absolute;left:0;top:0;bottom:0;border-radius:6px;width:0%;
    background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.65));}
  .seek .knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 10px rgba(0,0,0,.3);
    opacity:0;transition:opacity .2s;}
  .seek:hover .knob{opacity:1;}
  .times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:9px;
    font-variant-numeric:tabular-nums;}

  /* 控制 */
  .ctrl{padding:20px 24px 6px;display:flex;align-items:center;justify-content:center;gap:26px;position:relative;z-index:2;}
  .ctrl .tbtn{width:46px;height:46px;}
  .ctrl .tbtn svg{width:18px;height:18px;fill:#fff;}
  .play{
    width:64px!important;height:64px!important;border-radius:50%!important;
    border:1px solid var(--line)!important;
    background:linear-gradient(150deg,rgba(255,255,255,.32),rgba(255,255,255,.10))!important;
    box-shadow:0 10px 30px rgba(8,10,30,.5),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.15)!important;
    position:relative;
  }
  .play::before{
    content:"";position:absolute;inset:-2px;border-radius:50%;
    background:var(--cover-glow,linear-gradient(135deg,#7b61ff,#2dd4ff));
    filter:blur(10px);opacity:.5;z-index:-1;
  }
  .play svg{width:24px!important;height:24px!important;}
  .play:hover{transform:scale(1.07);}

  /* 音量 */
  .vol{padding:6px 24px 14px;display:flex;align-items:center;gap:12px;position:relative;z-index:2;}
  .vol svg{width:16px;height:16px;fill:rgba(255,255,255,.7);flex-shrink:0;}
  .vol .seek{height:4px;background:rgba(255,255,255,.14);}
  .vol .seek .knob{display:none;}
  .vol .seek .track{width:70%;}

  /* 播放列表 */
  .pl-head{padding:14px 24px 8px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;}
  .pl-head .t{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .chip{font-size:11px;color:#fff;padding:3px 11px;border-radius:14px;font-weight:600;
    background:var(--glass-strong);border:1px solid var(--line-soft);
    backdrop-filter:blur(6px);}
  .pl{flex:1;overflow-y:auto;padding:0 14px 20px;position:relative;z-index:2;}
  .pl::-webkit-scrollbar{width:5px;}
  .pl::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:5px;}
  .item{display:flex;align-items:center;gap:13px;padding:9px 12px;border-radius:14px;cursor:pointer;
    border:1px solid transparent;transition:all .2s;}
  .item:hover{background:rgba(255,255,255,.09);border-color:var(--line-soft);transform:translateX(3px);}
  .item.on{background:var(--glass-strong);border-color:var(--line);box-shadow:0 6px 18px rgba(8,10,30,.3);}
  .item .thumb{width:42px;height:42px;border-radius:12px;flex-shrink:0;position:relative;overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.4);}
  .item .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.3),transparent 50%);}
  .item .meta{flex:1;min-width:0;}
  .item .meta .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.25);}
  .item .meta .a{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .eq{display:none;gap:3px;align-items:flex-end;height:15px;}
  .item.on .eq{display:flex;}
  .item .eq i{width:3px;background:#fff;border-radius:2px;box-shadow:0 0 6px rgba(255,255,255,.7);animation:bars 1s ease-in-out infinite alternate;}
  .item .eq i:nth-child(1){height:60%;animation-delay:0s;}
  .item .eq i:nth-child(2){height:100%;animation-delay:.2s;}
  .item .eq i:nth-child(3){height:45%;animation-delay:.4s;}
  @keyframes bars{from{transform:scaleY(.35);}to{transform:scaleY(1);}}
  .item .dur{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;}

  /* 提示条 */
  .hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;
    font-size:11px;color:var(--muted);letter-spacing:.5px;white-space:nowrap;
    background:rgba(255,255,255,.06);border:1px solid var(--line-soft);
    padding:5px 13px;border-radius:14px;backdrop-filter:blur(6px);opacity:0;transition:opacity .3s;pointer-events:none;}
  .hint.show{opacity:1;}

  @media(max-width:440px){
    .drawer{inset:0;width:100%;max-width:100%;border-radius:20px 0 0 20px;border-right:none;}
    .cover-wrap{width:170px;height:170px;}
    .hero{padding:38px 26px;}
    .hero h1{font-size:27px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="kicker">Glass Player</div>
  <h1>高级磨砂质感<br><span>侧边栏音乐播放器</span></h1>
  <p>毛玻璃浮层 · 封面渐变光晕 · 实时频谱<br>点开右侧按钮，体验完整播放界面</p>
</div>

<button class="fab" id="fab" title="打开播放器">
  <span class="bar"></span>
  <span class="pip" id="fabPip"></span>
  <span class="mini" id="fabMini"></span>
  <span class="note"></span>
</button>

<div class="veil" id="veil"></div>

<aside class="drawer" id="drawer">
  <div class="hint" id="hint">空格 播放/暂停 · ← → 切歌 · Esc 关闭</div>
  <div class="top">
    <div>
      <div class="label">Now Playing</div>
      <div class="nowplay" id="stateTxt">已暂停</div>
    </div>
    <div class="top-actions">
      <button class="tbtn" id="addBtn" title="添加本地歌曲">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      </button>
      <input type="file" id="fileInput" accept="audio/*" multiple style="display:none">
      <button class="tbtn" id="closeBtn" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>

  <div class="stage">
    <div class="cover-wrap" id="coverWrap">
      <div class="cover">
        <div class="art" id="art"></div>
        <div class="glow-orb"></div>
        <div class="vignette"></div>
      </div>
    </div>
    <div class="info">
      <div class="name" id="curName">—</div>
      <div class="artist" id="curArtist">—</div>
    </div>
    <div class="spectrum" id="spectrum"></div>
  </div>

  <div class="seek-wrap">
    <div class="seek" id="seek"><div class="track" id="seekTrack"></div><div class="knob" id="seekKnob"></div></div>
    <div class="times"><span id="curTime">0:00</span><span id="totalTime">0:00</span></div>
  </div>

  <div class="ctrl">
    <button class="tbtn" id="prevBtn" title="上一首">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="tbtn play" id="playBtn" title="播放/暂停">
      <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="tbtn" id="nextBtn" title="下一首">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>

  <div class="vol">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
    <div class="seek" id="volBar"><div class="track" id="volTrack"></div></div>
  </div>

  <div class="pl-head">
    <span class="t">Playlist</span><span class="chip" id="songCount">0 首</span>
  </div>
  <div class="pl" id="pl"></div>
</aside>

<script>
/* ===== 数据 ===== */
const palette=[
  ['#ff9a9e','#f6416c'],['#a18cd1','#fbc2eb'],['#43e97b','#38f9d7'],
  ['#4facfe','#00f2fe'],['#fa709a','#fee140'],['#667eea','#764ba2'],
  ['#f093fb','#f5576c'],['#ffecd2','#fcb69f'],['#30cfd0','#330867'],
];
let songs=[],current=0,playing=false,timer=null,sec=0,audio=null;

let lastKey=null;
function ensureAudio(){
  if(audio)return audio;
  audio=new Audio();
  audio.preload='auto';
  audio.crossOrigin='anonymous';
  audio.addEventListener('loadedmetadata',()=>{
    if(isFinite(audio.duration)&&audio.duration>0){
      songs[current].dur=Math.round(audio.duration);
      S('totalTime').textContent=fmt(audio.duration);
    }
  });
  audio.addEventListener('ended',()=>next());
  audio.addEventListener('timeupdate',()=>{
    if(!isNaN(audio.currentTime)){sec=Math.floor(audio.currentTime);seekUI();}
  });
  /* 关键：无论任何原因导致的加载/解码失败，都不要在"假播放"状态挂着 */
  audio.addEventListener('error',()=>{
    S('stateTxt').textContent='播放失败';
    S('coverWrap').classList.remove('spin');
    stopSpectrum();clearInterval(timer);
  });
  return audio;
}

/* 把直链里的中文/日文特殊字符做 encodeURI 兜底 */
function safeUrl(u){
  try{return decodeURIComponent(u)===u?u:u;}catch(e){return u;}
}
function tryPlay(s,a){
  const candidates=[s.url,safeUrl(s.url),encodeURI(s.url)];
  let i=0;
  const next=()=>{
    if(i>=candidates.length){S('stateTxt').textContent='播放失败';return;}
    a.src=candidates[i++];a.load();
    const p=a.play();
    if(p&&p.catch){p.catch(err=>next());}
  };
  next();
}
const S=id=>document.getElementById(id);

function makeSong(name,artist,dur,cover){
  return {name,artist,dur,cover:cover||`linear-gradient(135deg,${randPal()[0]},${randPal()[1]})`,_objUrl:null};
}
function randPal(){return palette[Math.floor(Math.random()*palette.length)];}

/* 播放列表：歌名与链接上的文件名完全一致 */
const URL_辛島純子='https://Asamoisnailong.github.io/qianmo/%E8%BE%9B%E5%B3%B6%E7%B4%94%E5%AD%90%20-%20TRUE%E2%99%A5%EF%B8%8ELOVE_1794227334442_99e9v.mp3';
const URL_打火机='https://Asamoisnailong.github.io/qianmo/%E6%89%93%E7%81%AB%E6%9C%BA%EF%BC%88%E6%B5%81%E6%B5%AA%E8%80%85%E7%89%88%EF%BC%89_1794227326729_6y698.mp3';
const URL_占据你='https://Asamoisnailong.github.io/qianmo/%E6%88%91%E6%83%B3%E8%A6%81%E5%8D%A0%E6%8D%AE%E4%BD%A0%EF%BC%88Cover%E6%B5%81%E6%B5%AA%E8%80%85%EF%BC%89_1794227320615_v751x.mp3';
const URL_月綺麗='https://Asamoisnailong.github.io/qianmo/%E6%9C%88%E3%81%8C%E7%B6%BA%E9%BA%97%E3%81%AD%E3%81%A8%E8%A8%80%E3%82%8F%E3%82%8C%E3%81%9F%E3%81%84_1794228212562_8hciv.mp3';
const URL_回忆格式化='https://Asamoisnailong.github.io/qianmo/%E5%9B%9E%E5%BF%86%E6%A0%BC%E5%BC%8F%E5%8C%96_1794228218516_1abxb.mp3';
const URL_CityOfStars='https://Asamoisnailong.github.io/qianmo/CityOfStars_1794228215945_jza8b.mp3';

function urlSong(name,artist,dur,url,cover){
  return {name,artist,dur,cover:cover||`linear-gradient(135deg,${randPal()[0]},${randPal()[1]})`,url};
}

songs=[
  urlSong("辛島純子 - TRUE♥︎LOVE","辛島純子",180,URL_辛島純子),
  urlSong("打火机（流浪者版）","网络歌曲",180,URL_打火机),
  urlSong("我想要占据你（Cover流浪者）","网络歌曲",180,URL_占据你),
  urlSong("月が綺麗ねと言われたい","カササギ",180,URL_月綺麗),
  urlSong("CityOfStars","Ryan Gosling、Emma Stone",180,URL_CityOfStars),
  urlSong("回忆格式化","M3mo",180,URL_回忆格式化),
];

/* ===== 渲染 ===== */
function render(){
  S('pl').innerHTML=songs.map((s,i)=>`
    <div class="item ${i===current?'on':''}" data-i="${i}">
      <div class="thumb" style="background:${s.cover}"></div>
      <div class="meta"><div class="n">${s.name.split('_')[0]}</div><div class="a">${s.artist}</div></div>
      <div class="eq"><i></i><i></i><i></i></div>
      <span class="dur">${fmt(s.dur)}</span>
    </div>`).join('');
  S('songCount').textContent=songs.length+' 首';
  S('pl').querySelectorAll('.item').forEach(el=>el.onclick=()=>{current=+el.dataset.i;load();play();});
}
function applyTheme(){
  const s=songs[current];
  const m=/linear-gradient\(135deg,([^,]+),([^)]+)\)/.exec(s.cover);
  const c1=m?m[1].trim():'#7b61ff',c2=m?m[2].trim():'#2dd4ff';
  document.documentElement.style.setProperty('--cover-glow',`linear-gradient(135deg,${c1},${c2})`);
  S('art').style.background=s.cover;
  S('art').style.backgroundSize='cover';
  S('art').style.backgroundPosition='center';
  S('fabMini').style.background=s.cover;
  S('glowOrb').style.background=`radial-gradient(circle,${c1},transparent)`;
}
function load(){
  lastKey=null;
  const s=songs[current];
  S('curName').textContent=s.name.split('_')[0];
  S('curArtist').textContent=s.artist;
  S('totalTime').textContent=fmt(s.dur);
  sec=0;seekUI();applyTheme();render();
}
function seekUI(){
  const p=Math.min(100,sec/songs[current].dur*100);
  S('seekTrack').style.width=p+'%';
  S('seekKnob').style.left=p+'%';
  S('curTime').textContent=fmt(sec);
}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

/* ===== 播放控制 ===== */
function play(){
  if(!songs.length)return;
  const a=ensureAudio();
  const s=songs[current];
  const key=(s.url||'')+(s._objUrl||'')+(s._name||'');
  /* 换源：切歌、重播同一首、之前加载失败的歌，都强制重写 src */
  if(!lastKey||lastKey!==key){
    lastKey=key;
    if(s.url){tryPlay(s,a);}
    else if(s._objUrl){a.src=s._objUrl;a.load();a.play().catch(()=>{});}
  }else{
    /* 同一首且已加载：仅续播，避免打断 */
    if(a.paused)a.play().catch(()=>{});
  }
  playing=true;
  S('playIcon').innerHTML='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  S('stateTxt').textContent='正在播放';
  S('coverWrap').classList.add('spin');
  S('fabPip').style.display='none';
  startSpectrum();
  clearInterval(timer);
  timer=setInterval(seekUI,500);
}
function pause(){
  if(audio)audio.pause();
  playing=false;
  S('playIcon').innerHTML='<path d="M8 5v14l11-7z"/>';
  S('stateTxt').textContent='已暂停';
  S('coverWrap').classList.remove('spin');
  stopSpectrum();
  clearInterval(timer);
}
function toggle(){playing?pause():play();}
function next(){if(!songs.length)return;current=(current+1)%songs.length;lastKey=null;load();if(playing)play();else seekUI();}
function prev(){if(!songs.length)return;current=(current-1+songs.length)%songs.length;lastKey=null;load();if(playing)play();else seekUI();}

/* ===== 频谱动画 ===== */
let specRAF=null,specBars=null;
function buildSpectrum(){
  S('spectrum').innerHTML=Array.from({length:28},()=>'<span></span>').join('');
  specBars=[...S('spectrum').children];
}
function startSpectrum(){
  let t=0;
  const step=()=>{
    t+=.12;
    specBars.forEach((b,i)=>{
      const v=playing
        ?6+Math.abs(Math.sin(t+i*.45)*Math.cos(t*.7+i*.2))*24
        :6+Math.abs(Math.sin(t*.5+i*.3))*4;
      b.style.height=v+'px';
    });
    specRAF=requestAnimationFrame(step);
  };
  cancelAnimationFrame(specRAF);step();
}
function stopSpectrum(){
  cancelAnimationFrame(specRAF);
  if(specBars)specBars.forEach(b=>b.style.height='6px');
}

/* ===== 进度条 / 音量拖拽 ===== */
function bindDrag(bar,onMove){
  let active=false;
  const move=e=>{if(!active)return;const r=bar.getBoundingClientRect();
    onMove(Math.max(0,Math.min(1,((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width)));};
  bar.addEventListener('mousedown',e=>{active=true;move(e);});
  bar.addEventListener('touchstart',e=>{active=true;move(e);},{passive:true});
  addEventListener('mousemove',move);addEventListener('touchmove',move,{passive:true});
  addEventListener('mouseup',()=>active=false);addEventListener('touchend',()=>active=false);
}
bindDrag(S('seek'),p=>{sec=Math.round(p*songs[current].dur);seekUI();});
bindDrag(S('volBar'),p=>{S('volTrack').style.width=p*100+'%';});

/* ===== 添加本地歌曲 ===== */
S('addBtn').onclick=()=>S('fileInput').click();
S('fileInput').onchange=e=>{
  [...e.target.files].forEach(f=>{
    const url=URL.createObjectURL(f);
    const audio=new Audio();audio.src=url;
    audio.onloadedmetadata=()=>{
      const dur=isFinite(audio.duration)?Math.round(audio.duration):180;
      const name=f.name.replace(/\.[^/.]+$/,"").split('_')[0];
      songs.push({name:name.split('_')[0],artist:'本地音频',dur,cover:`linear-gradient(135deg,${randPal()[0]},${randPal()[1]})`,_objUrl:url});
      render();S('hint').textContent='已添加 '+name.split('_')[0];S('hint').classList.add('show');
      setTimeout(()=>S('hint').classList.remove('show'),1600);
    };
  });
  e.target.value='';
};

/* ===== 抽屉开关 ===== */
const drawer=S('drawer'),fab=S('fab');
function openD(){drawer.classList.add('show');S('veil').classList.add('show');fab.classList.add('hide');}
function closeD(){drawer.classList.remove('show');S('veil').classList.remove('show');fab.classList.remove('hide');}
fab.onclick=openD;S('closeBtn').onclick=closeD;S('veil').onclick=closeD;
addEventListener('keydown',e=>{
  if(e.key==='Escape')closeD();
  if(!drawer.classList.contains('show'))return;
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='ArrowRight')next();
  if(e.code==='ArrowLeft')prev();
});

/* ===== 悬浮提示 ===== */
let hintTimer;
addEventListener('keydown',()=>{if(drawer.classList.contains('show')){
  S('hint').classList.add('show');clearTimeout(hintTimer);hintTimer=setTimeout(()=>S('hint').classList.remove('show'),2200);}});

S('playBtn').onclick=toggle;S('nextBtn').onclick=next;S('prevBtn').onclick=prev;

buildSpectrum();render();load();
</script>
</body>
</html>
