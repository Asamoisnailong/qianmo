<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日校园 · 校园论坛 | CAMPUS BBS</title>
<style>
:root{
  --bg:#f2f3f5; --panel:#ffffff; --line:#eaecef; --line-2:#f0f1f3;
  --text:#0f1419; --text-2:#576574; --text-3:#8a96a3;
  --brand:#f53b4d; --brand-soft:#fff0f1;
  --blue:#1d9bf0; --orange:#ff8a00; --purple:#7c5cff; --green:#12b886;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 2px 12px rgba(20,25,35,.07);
  --shadow-lg:0 8px 30px rgba(20,25,35,.12);
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfd6de;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* 顶部 */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff7a5c,#f53b4d);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 8px rgba(245,59,77,.3)}
.logo-text{display:flex;flex-direction:column;line-height:1.15}
.logo-text b{font-size:15px;letter-spacing:.5px}
.logo-text span{font-size:10px;color:var(--text-3);letter-spacing:1px;text-transform:uppercase}
.search{flex:1;max-width:420px;height:34px;margin-left:auto;background:#f0f2f5;border-radius:20px;display:flex;align-items:center;gap:8px;padding:0 14px}
.search svg{flex-shrink:0;opacity:.5}
.search input{border:none;outline:none;background:none;flex:1;font-size:13.5px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.btn-pill{height:32px;padding:0 14px;border-radius:20px;font-size:13.5px;font-weight:600;background:#f0f2f5;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;transition:.18s}
.btn-pill:hover{background:#e6e9ed;color:var(--text)}
.btn-brand{background:var(--brand);color:#fff}
.btn-brand:hover{background:#e22d3f;color:#fff}
.avatar-mini{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#c66bff);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}

/* 布局 */
.layout{max-width:1180px;margin:0 auto;padding:16px;display:grid;grid-template-columns:200px minmax(0,1fr) 300px;gap:16px;align-items:start}
.left,.right{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto}
.left::-webkit-scrollbar,.right::-webkit-scrollbar{display:none}

/* 侧边导航 */
.side-nav{background:var(--panel);border-radius:var(--r);padding:8px;box-shadow:var(--shadow-sm);border:1px solid var(--line-2)}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:10px;font-size:14.5px;color:var(--text-2);transition:.16s;text-align:left}
.nav-item:hover{background:#f5f7f9;color:var(--text)}
.nav-item .ico{width:20px;height:20px;flex-shrink:0;opacity:.75}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--brand);color:#fff;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.nav-item.on{background:var(--brand-soft);color:var(--brand);font-weight:700}
.nav-item.on .ico{opacity:1}
.nav-divider{height:1px;background:var(--line-2);margin:8px 6px}

/* tabs / sort */
.tabs-wrap{background:var(--panel);border-radius:var(--r);padding:4px;box-shadow:var(--shadow-sm);border:1px solid var(--line-2);margin-bottom:12px;overflow:auto}
.tabs{display:flex;gap:4px}
.tab{flex-shrink:0;padding:9px 16px;border-radius:9px;font-size:14px;color:var(--text-2);font-weight:500;transition:.16s;white-space:nowrap}
.tab:hover{background:#f5f7f9}
.tab.on{background:var(--text);color:#fff;font-weight:600}
.sortbar{display:flex;align-items:center;gap:6px;padding:0 2px 10px}
.sortbar .label{font-size:13px;color:var(--text-3);margin-right:auto}
.chip{font-size:12.5px;color:var(--text-2);padding:5px 11px;border-radius:20px;background:#fff;border:1px solid var(--line);transition:.16s}
.chip:hover{border-color:#c9d2da;color:var(--text)}
.chip.on{background:var(--text);color:#fff;border-color:var(--text)}

/* 帖子卡片 */
.feed{display:flex;flex-direction:column;gap:10px}
.post{background:var(--panel);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--line-2);transition:box-shadow .18s,border-color .18s,transform .18s}
.post:hover{box-shadow:var(--shadow-md);border-color:#dfe3e8}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ava{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:16px;font-weight:700;color:#fff;position:relative;cursor:pointer;overflow:hidden;background-size:cover;background-position:center}
.ava>img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:50%}
.ava.sm{width:34px;height:34px;font-size:13px}
.ava.xs{width:28px;height:28px;font-size:11px}
.ava.online::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;background:#1ec96d;border:2px solid #fff;border-radius:50%}
.names{min-width:0;flex:1}
.names .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.uname{font-size:14.5px;font-weight:700;cursor:pointer}
.uname:hover{color:var(--blue);text-decoration:underline}
.tag-v{width:15px;height:15px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex-shrink:0}
.uname.sub{font-weight:600;color:var(--text-2)}
.meta{font-size:12px;color:var(--text-3);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot-sep{opacity:.6}
.time-hot{display:flex;align-items:center;gap:5px}
.time-hot.hot{color:var(--brand);font-weight:700}
.time-hot svg{opacity:.9}
.more-btn{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:var(--text-3);transition:.16s}
.more-btn:hover{background:#f2f4f6;color:var(--text)}

.board-tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:6px;font-weight:600;line-height:1.6}
.board-tag.obs{background:#eaf4ff;color:#2b7de9}
.board-tag.fun{background:#fff4e6;color:#e8892b}
.board-tag.anon{background:#f2f3f7;color:#6b7280}
.board-tag.recruit{background:#eafaf3;color:#0ea472}
.board-tag.daily{background:#eef9f0;color:#3aa76d}
.board-tag.hot{background:#fff0f1;color:var(--brand)}
.board-tag.eye{background:#f0ecff;color:#6b4dff}

.p-body{cursor:pointer}
.p-title{font-size:16.5px;font-weight:800;line-height:1.5;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-title .kw{color:var(--brand)}
.p-text{font-size:15px;line-height:1.75;color:#1c2128;margin:0 0 10px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p-text.full{display:block;-webkit-line-clamp:unset}
.p-media{display:grid;gap:3px;border-radius:var(--r-sm);overflow:hidden;margin-bottom:10px}
.p-media.count-1{grid-template-columns:1fr}
.p-media.count-2{grid-template-columns:1fr 1fr}
.p-media.count-3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.p-media.count-3 .ph:first-child{grid-row:span 2}
.p-media.count-4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.ph{position:relative;min-height:150px;background:#eef1f4;display:grid;place-items:center;color:rgba(255,255,255,.92);font-size:12px}
.ph.hero{min-height:210px}
.ph::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.28))}
.ph .cap{position:absolute;left:10px;bottom:9px;font-size:12px;z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.4);font-weight:500}
.ph .icon-big{font-size:38px;z-index:2;opacity:.92;text-shadow:0 2px 6px rgba(0,0,0,.18)}
.ph .cap.r{right:10px;left:auto}
.poll{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px;background:#fcfdfe}
.poll-q{font-size:14.5px;font-weight:700;margin-bottom:10px}
.poll-opt{position:relative;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;overflow:hidden}
.poll-opt:last-child{margin-bottom:0}
.poll-bar{position:absolute;left:0;top:0;bottom:0;background:var(--brand-soft);z-index:0;border-radius:8px}
.poll-opt span{position:relative;z-index:1}
.poll-opt b{position:relative;z-index:1;float:right;color:var(--brand);font-size:12.5px}
.poll-foot{font-size:12px;color:var(--text-3);margin-top:8px}

/* 互动条 */
.actbar{display:flex;align-items:center;margin-top:2px;padding-top:8px;border-top:1px solid var(--line-2)}
.act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:8px;font-size:13px;color:var(--text-2);transition:.15s}
.act:hover{background:#f2f4f6}
.act:hover .a-ico{transform:scale(1.12)}
.act.like:hover .a-ico{color:var(--brand)}
.act.like.on{color:var(--brand)}
.act.like.on .a-ico{color:var(--brand)}
.act.com:hover .a-ico{color:#12b886}
.act.rep:hover .a-ico{color:var(--purple)}
.a-ico{width:18px;height:18px;display:grid;place-items:center;transition:.15s}
.a-ico svg{width:100%;height:100%}
.act .num{min-width:8px;text-align:left}

/* 评论预览 */
.c-prev{margin-top:10px;background:#f7f8fa;border-radius:var(--r-sm);padding:10px 12px}
.c-prev-h{font-size:12.5px;color:var(--text-3);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.c-line{display:flex;gap:9px;padding:5px 0;font-size:13.5px;line-height:1.55}
.c-line .ct{min-width:0;flex:1}
.c-line .cn{font-weight:700;font-size:13px}
.c-line .cn.sub{color:var(--text-2)}
.c-line .cn.tag{color:var(--brand);font-size:11.5px;font-weight:600;margin-left:4px}
.c-line .cx{color:var(--text-2);font-size:12.5px}
.c-more{margin-top:6px;font-size:13px;color:var(--text-2);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.c-more:hover{color:var(--blue)}

/* 右侧栏 */
.widget{background:var(--panel);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow-sm);border:1px solid var(--line-2);margin-bottom:12px}
.w-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.w-head b{font-size:15px}
.w-head a{font-size:12.5px;color:var(--text-3)}
.w-head a:hover{color:var(--blue)}
.hot-list{display:flex;flex-direction:column}
.hot-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-2);cursor:pointer}
.hot-item:last-child{border-bottom:none}
.hot-rank{width:20px;height:20px;flex-shrink:0;border-radius:5px;background:#f2f4f6;color:var(--text-2);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.hot-rank.top3{background:var(--brand);color:#fff}
.hot-ct{min-width:0;flex:1}
.hot-ct b{font-size:13.5px;line-height:1.45;display:block}
.hot-ct span{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:8px;margin-top:3px}
.member-list{display:flex;flex-direction:column;gap:2px}
.member{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;transition:.15s}
.member:hover{background:#f5f7f9}
.member .ava{width:38px;height:38px;font-size:14px}
.member .mi{min-width:0;flex:1}
.member .mi b{font-size:13.5px;display:block}
.member .mi span{font-size:11.5px;color:var(--text-3)}
.member .follow{font-size:12.5px;font-weight:700;color:var(--brand);border:1px solid var(--brand);border-radius:16px;padding:3px 12px;transition:.15s;flex-shrink:0}
.member .follow.on{color:var(--text-3);border-color:var(--line)}
.member .follow:not(.on):hover{background:var(--brand);color:#fff}
.notice{font-size:12.5px;color:var(--text-2);line-height:1.8}
.notice b{color:var(--text)}
.tip{font-size:11.5px;color:var(--text-3);line-height:1.7;background:#f7f8fa;border-radius:10px;padding:10px 12px}

/* 详情页 */
.detail-scroll{position:fixed;inset:0;background:var(--bg);z-index:100;overflow-y:auto;display:none;animation:slideIn .24s ease}
.detail-scroll.show{display:block}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.detail-nav{position:sticky;top:0;z-index:5;height:52px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;max-width:780px;margin:0 auto}
.back-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f2f4f6;transition:.15s}
.back-btn:hover{background:#e6e9ed}
.detail-nav .title{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-wrap{max-width:780px;margin:0 auto;padding:14px 16px 60px}
.detail-post{background:var(--panel);border-radius:var(--r);padding:18px 20px 4px;box-shadow:var(--shadow-sm);border:1px solid var(--line-2)}
.detail-post .p-title{font-size:19px;-webkit-line-clamp:unset}
.detail-post .p-text{font-size:15.5px;-webkit-line-clamp:unset;white-space:pre-wrap}
.detail-act{display:flex;align-items:center;gap:18px;padding:14px 0;border-top:1px solid var(--line-2);margin-top:14px;font-size:13.5px;color:var(--text-2)}
.detail-act .act{flex:none;height:auto}
.com-editor{display:flex;gap:12px;padding:16px 0;border-top:1px solid var(--line-2);margin-top:6px}
.com-editor textarea{flex:1;min-height:60px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;resize:vertical;outline:none;font-family:inherit;transition:.18s;background:#fafbfc}
.com-editor textarea:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(29,155,240,.1)}
.com-editor .send{align-self:flex-end;height:38px;padding:0 20px;border-radius:20px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;flex-shrink:0;transition:.15s}
.com-editor .send:hover{background:#e22d3f}
.com-list{margin-top:8px;background:var(--panel);border-radius:var(--r);padding:4px 20px 20px;box-shadow:var(--shadow-sm);border:1px solid var(--line-2)}
.com-list-h{position:sticky;top:52px;z-index:4;background:var(--panel);padding:14px 0 10px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line-2);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.com-list-h span{font-size:12.5px;color:var(--text-3);font-weight:500}
.sort-com{margin-left:auto;font-size:12.5px;color:var(--text-3);display:flex;gap:12px}
.sort-com a.on{color:var(--text);font-weight:600}
.com-item{padding:14px 0;border-bottom:1px solid var(--line-2)}
.com-item:last-child{border-bottom:none}
.com-head{display:flex;align-items:flex-start;gap:10px}
.com-head .ava{width:38px;height:38px;font-size:14px}
.com-main{min-width:0;flex:1}
.com-top{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.com-top .uname{font-size:14px}
.floor{font-size:11.5px;color:var(--text-3);margin-left:auto}
.com-time{font-size:12px;color:var(--text-3);margin-top:1px}
.com-body{font-size:14.5px;line-height:1.75;margin:6px 0 8px;white-space:pre-wrap;word-break:break-word}
.com-acts{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--text-3)}
.com-acts a{cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:4px}
.com-acts a:hover{color:var(--text)}
.com-acts a.liked{color:var(--brand)}
.thread{margin-top:10px;background:#f7f8fa;border-radius:12px;padding:4px 14px 10px;border:1px solid var(--line-2)}
.thread-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:13.5px;line-height:1.6}
.thread-item:last-child{border-bottom:none}
.thread-item .ava{width:28px;height:28px;font-size:11px}
.thread-ct{min-width:0;flex:1}
.thread-ct .cn{font-weight:700;font-size:13px;cursor:pointer}
.thread-ct .cn:hover{color:var(--blue)}
.thread-ct .cn.op{color:var(--brand)}
.thread-ct .cn.rep{color:var(--text-3);font-weight:500}
.thread-ct .tx{color:#1c2128;white-space:pre-wrap;word-break:break-word}
.thread-ct .ft{font-size:11.5px;color:var(--text-3);margin-top:3px;display:flex;gap:12px}
.thread-ct .ft a{cursor:pointer}
.thread-ct .ft a:hover{color:var(--brand)}
.thread-more{font-size:12.5px;color:var(--text-2);font-weight:600;padding:8px 0 4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.thread-more:hover{color:var(--blue)}
.thread-reply{display:none;margin-top:10px;gap:10px;align-items:flex-start}
.thread-reply.show{display:flex}
.thread-reply input{flex:1;border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;outline:none;background:#fff;transition:.15s}
.thread-reply input:focus{border-color:var(--blue)}
.thread-reply button{font-size:13px;font-weight:700;color:var(--brand);padding:7px 14px;flex-shrink:0;transition:.15s}
.thread-reply button:hover{opacity:.8}
.empty-thread{font-size:12.5px;color:var(--text-3);padding:6px 0 2px}
.thread-page{font-size:12px;color:var(--text-3);padding-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.thread-page a{cursor:pointer;min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;transition:.15s}
.thread-page a.on{background:var(--text);color:#fff;border-color:var(--text)}
.thread-page a:hover:not(.on){border-color:#c9d2da}

.fab{position:fixed;right:28px;bottom:34px;z-index:60;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(245,59,77,.4);display:grid;place-items:center;transition:.18s}
.fab:hover{transform:scale(1.06);background:#e22d3f}
.fab svg{width:24px;height:24px}
.toast{position:fixed;left:50%;top:78px;transform:translate(-50%,-16px);z-index:200;background:rgba(15,20,25,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:1080px){
  .layout{grid-template-columns:64px minmax(0,1fr);gap:12px}
  .nav-item span:not(.badge){display:none}
  .nav-item{justify-content:center;padding:12px 0}
  .nav-item .badge{display:none}
  .right{display:none}
}
@media(max-width:720px){
  .layout{grid-template-columns:minmax(0,1fr);padding:10px}
  .left{display:none}
  .search{display:none}
  .detail-post{padding:14px 14px 4px}
  .com-list{padding:4px 14px 20px}
  .topbar-inner{padding:0 10px;gap:8px}
  .btn-pill:not(.btn-brand){display:none}
  .fab{right:16px;bottom:20px}
}
</style>
</head>
<body>

<header class="topbar">

const ava=(u,cls='')=>{const o=USERS[u];if(!o)return '';
  const cd=`ava-${u}`; if(S.avaBroken&&S.avaBroken[cd]) return `<div class="ava ${cls}" style="background:${o.c}">${esc(o.n[0])}</div>`;
  const st=o.av?`background-image:url('${o.av}');background-size:cover;background-position:center;`:`background:${o.c};`;
  return `<div class="ava ${cls}" style="${st}"><img alt="" src="${o.av||''}" onerror="avaFail(this,'${u}')" style="${o.av?'':'display:none'};width:100%;height:100%;border-radius:50%;object-fit:cover;position:absolute;inset:0;"><span style="${o.av?'':'position:static'};z-index:1">${esc(o.n[0])}</span></div>`;};
const avaFail=(img,u)=>{img.style.display='none';img.removeAttribute('src');
  const cd=`ava-${u}`;S.avaBroken=S.avaBroken||{};S.avaBroken[cd]=1;save();};

/* ===================== Toast ===================== */
let toastTimer;
function toast(msg){
  const el=$('#toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

function renderSide(){
  $('#sideNav').innerHTML=NAV.map(n=>{

    const on = n.k===curBoard ? ' on' : '';
    const badge = n.badge ? `<span class="badge">${n.badge}</span>` : '';
    return `<button class="nav-item${on}" onclick="filterBoard('${n.k}',this)">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${n.ico}</svg>

function filterBoard(k,el){
  if(!['all','obs','fun','anon','recruit','daily','hot','tree'].includes(k)){toast('演示版暂未开放「'+el.textContent.trim()+'」');return;}
  curBoard=k;renderSide();renderTabs();
  $$('.nav-item').forEach(n=>n.classList.toggle('on',n.textContent.trim()===BOARD[k]||(k==='all'&&n.textContent.trim()==='论坛首页')));
  renderFeed();window.scrollTo({top:0,behavior:'smooth'});
}

const TABS=[{k:'all',t:'全部'},{k:'obs',t:'社团观察'},{k:'fun',t:'校园趣闻'},{k:'anon',t:'匿名投稿'},{k:'recruit',t:'社团招新'},{k:'daily',t:'社团日常'},{k:'hot',t:'校园热议'},{k:'tree',t:'校园树洞'}];
let curBoard='all',curSort='hot';
function renderTabs(){ $('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.k===curBoard?'on':''}" onclick="filterBoard('${t.k}',this)">${t.t}</button>`).join(''); }
function setSort(el){curSort=el.dataset.sort;$$('.chip').forEach(c=>c.classList.toggle('on',c===el));renderFeed();}

function getList(){
  const data=POSTS();
  let l=data.filter(p=>curBoard==='all'||p.board===curBoard);
  const h=p=>p.hot*1e6+p.replies*10+p.views;
  if(curSort==='hot')      l.sort((a,b)=>h(b)-h(a));
  else if(curSort==='new') l.sort((a,b)=>a.id-b.id);
  else if(curSort==='rep') l.sort((a,b)=>b.replies-a.replies);
  else if(curSort==='view')l.sort((a,b)=>b.views-a.views);
  return l;
}
function mediaHTML(m){ return ''; }
function pollHTML(p){ return ''; }
function headHTML(p){
  const a=p.author.u==='anon'?null:USERS[p.author.u];

  const titleHTML=a
    ? uname(p.author.u)+` <span style="color:var(--text-3);font-weight:400;font-size:13px">${esc(a.t)}</span>`

  return `<div class="head">

    <div class="names"><div class="top">${titleHTML}</div>

        <span class="dot-sep">·</span><span>${esc(p.time)}</span>
        <span class="dot-sep">·</span><span>浏览 ${fmt(p.views)}</span>
      </div>
    </div>
    <button class="more-btn" onclick="event.stopPropagation();toast('更多：${a?esc(a.t):esc(anonName)}')">

    </button>
  </div>`;
}
function actHTML(p){
  const liked=S.likes[p.id];const base=p.replies||0;
  const likeN=fmt((p.replies||0)+(liked||0));
  return `<div class="actbar">
    <button class="act ${liked?'like on':''}" onclick="event.stopPropagation();toggleLike(${p.id})">
      <span class="a-ico">${HEART_SVG}</span><span class="num">${fmt((p.replies||0)+(liked||0))}</span>
    </button>
    <button class="act com" onclick="event.stopPropagation();openDetail(${p.id})">

  const cs=p.comments.slice(0,3);

       <h3 class="p-title" style="font-size:19px;-webkit-line-clamp:unset">${esc(p.title)}</h3>
       <p class="p-text" style="font-size:15.5px">${esc(p.body)}</p>
       ${mediaHTML(p.media)}${pollHTML(p.poll)}
     </div>
     <div class="detail-act">${actHTML(p)}</div>
     <div class="com-editor">
       <div class="ava" style="background:#5b8cff">我</div>
       <textarea id="comInput" placeholder="说点什么吧…（演示：回车不提交，点发送）"></textarea>
       <button class="send" onclick="submitCom()">发送</button>
     </div>`;
  renderCom();
  $('#detail').classList.add('show');document.body.style.overflow='hidden';
  $('#detail').scrollTop=0;
}
function closeDetail(){ $('#detail').classList.remove('show');document.body.style.overflow='';curPost=null; }
function toggleLike(id){
  S.likes[id]=!S.likes[id];save();
  if(curPost&&curPost.id===id)renderCom(true);
  renderFeed();
  toast(S.likes[id]?'已点赞 ❤️':'已取消点赞');
}
function submitCom(){
  const ta=$('#comInput');const v=ta.value.trim();
  if(!v){toast('评论内容不能为空');ta.focus();return;}
  curPost.comments.push({u:'me',tx:v,t:'刚刚',likes:0,thread:[]});
  curPost.replies++;
  ta.value='';
  renderCom();renderFeed();toast('评论成功（演示，未持久化）');
}
function comActHTML(c,idx,total){
  const liked=S.likesT[c._k];
  return `<div class="com-acts">
    <a class="${liked?'liked':''}" onclick="toggleTLike(${idx})">${liked?'♥':'♡'} ${fmt((c.likes||0)+(liked||0))}</a>
    <a onclick="toggleReply(${idx})">${REPLY_SVG} 回复</a>
    <a>举报</a>
    <span class="floor">${total-idx} 楼</span></div>`;
}
function threadPageHTML(c,idx){
  const per=5;const arr=c.thread||[];const total=Math.max(1,Math.ceil(arr.length/per));
  const pg=S.tpages[idx]||1;
  if(arr.length<=per)return '';
  let h='';
  if(pg>1)h+=`<a onclick="setTPage(${idx},${pg-1})">‹</a>`;
  for(let i=1;i<=total;i++) h+=`<a class="${i===pg?'on':''}" onclick="setTPage(${idx},${i})">${i}</a>`;
  if(pg<total)h+=`<a onclick="setTPage(${idx},${pg+1})">›</a>`;
  return `<div class="thread-page">${h}</div>`;
}
function threadHTML(c,idx,visible){
  const arr=c.thread||[];const cut=arr.slice(0,visible);
  return `<div class="thread">
    ${cut.map((tr,j)=>{
      const u=USERS[tr.u]||{n:'我',c:'#5b8cff'};const on=!!S.likesT['t_'+idx+'_'+j];
      return `<div class="thread-item">
        <div class="ava xs" style="background:${u.c}">${esc(u.n[0])}</div>
        <div class="thread-ct">
          <span class="cn ${tr.u==='anon'?'rep':''}">${esc(u.n)}</span>
          <span class="cn op"> 回复 </span>
          <span class="cn rep">${esc((c.u==='anon'?'匿名用户':(USERS[c.u]||{}).n)||'用户')}</span>
          <div class="tx">${esc(tr.tx)}</div>
          <div class="ft">
            <span>${esc(tr.t)}</span>
            <a class="${on?'liked':''}" onclick="toggleTLike('t_${idx}_${j}',this)">${on?'♥':'♡'} ${fmt((tr.likes||0)+(on||0))}</a>
            <a onclick="focusThread(${idx})">回复</a>
          </div>
        </div></div>`;
    }).join('')}
    ${arr.length>visible?`<div class="thread-more" onclick="expandThread(${idx})">↳ 展开剩余 ${arr.length-visible} 条回复</div>`:''}
    ${threadPageHTML(c,idx)}
    <div class="thread-reply ${S.treads[idx]?'show':''}" id="tre${idx}">
      <input type="text" placeholder="回复 ${esc((USERS[c.u]||{n:'用户'}).n)}…" onkeydown="if(event.key==='Enter')sendThread(${idx},this)">
      <button onclick="sendThread(${idx},this.previousElementSibling)">回复</button>
    </div>
  </div>`;
}
function setTPage(idx,pg){S.tpages[idx]=pg;save();renderCom();}
function expandThread(idx){S.treads[idx]=1;delete S.tpages[idx];save();renderCom();}
function toggleReply(idx){S.treads[idx]=!S.treads[idx];save();renderCom();}
function focusThread(idx){S.treads[idx]=1;save();renderCom();setTimeout(()=>{$('#tre'+idx).querySelector('input').focus()},60);}
function sendThread(idx,input){
  const v=input.value.trim();if(!v){toast('回复内容不能为空');return;}
  curPost.comments[idx].thread.push({u:'me',tx:v,t:'刚刚',likes:0});
  input.value='';S.treads[idx]=0;save();renderCom();renderFeed();toast('回复成功（演示）');
}
function toggleTLike(k,_el){
  if(typeof k==='number'){S.likesT['c_'+k]=!S.likesT['c_'+k];k='c_'+k;}
  else S.likesT[k]=!S.likesT[k];
  save();renderCom(true);
}

function renderCom(same){
  if(!curPost)return;
  const cs=curPost.comments.slice();
  if(comSort==='new')cs.sort((a,b)=>0);
  else cs.sort((a,b)=>(b.likes||0)-(a.likes||0));
  const total=cs.length;
  $('#dCom').innerHTML=`<div class="com-list-h">
      <span>全部评论</span><span>${total} 条</span>
      <span class="sort-com">
        <a class="${comSort==='hot'?'on':''}" onclick="setComSort('hot')">最热</a>
        <a class="${comSort==='new'?'on':''}" onclick="setComSort('new')">最新</a>
      </span>
    </div>
    ${total?cs.map((c,i)=>{
      c._k='c_'+i;
      const u=USERS[c.u]||{n:'我',c:'#5b8cff',t:'楼主',cert:0};
      const me=c.u==='me';
      const visible= (c.thread||[]).length<=5&&!S.treads[i] ? (c.thread||[]).length : (c.thread||[]).length;
      return `<div class="com-item">
        <div class="com-head">
          <div class="ava ${me?'':'online'}" style="background:${u.c}">${esc(me?'我':u.n[0])}</div>
          <div class="com-main">
            <div class="com-top">
              <span class="uname ${me?'':'sub'}">${esc(me?'我':u.n)}</span>
              ${u.cert&&!me?'<span class="tag-v" title="已认证"><svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.8L22 10l-5.5 4.7L18 22l-6-3.6L6 22l1.5-7.3L2 10l7.6-1.2z"/></svg></span>':''}
              ${me?'<span class="board-tag anon">楼主</span>':''}
              ${c.u==='anon'?'<span class="board-tag anon">匿名</span>':''}
              <span class="com-time">${esc(c.t)}</span>
            </div>
            <div class="com-body">${esc(c.tx)}</div>
            ${comActHTML(c,i,total)}
            ${threadHTML(c,i,visible)}
          </div>
        </div>
      </div>`;
    }).join(''):`<div style="padding:34px 0;text-align:center;color:var(--text-3);font-size:13.5px">还没有评论，来抢沙发吧～</div>`}`;
}
function setComSort(k){comSort=k;renderCom();}

/* ===================== 初始化 ===================== */
function init(){
  renderSide();renderTabs();renderFeed();renderHot();renderActive();renderClubs();
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#detail').classList.contains('show'))closeDetail();});
}
init();
</script>
</body>
</html>
